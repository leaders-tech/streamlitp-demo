# Deploy the app on tlfpaas. Edit for settings or volumes; copy for a similar app.
services:
  web:
    build:
      context: .
    env_file: .docker.env
    expose:
      - "8080"
    labels:
      tlfpaas.route: "web"
    volumes:
      - counter_data:/data
    restart: unless-stopped

volumes:
  counter_data:

x-tlfpaas:
  settings:
    DB_PATH:
      default: "/data/counter.sqlite3"
      description: "SQLite file inside the persistent data volume."
